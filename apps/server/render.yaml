services:
  - type: web
    name: attendance-api
    runtime: node
    plan: free
    autoDeploy: false
    buildCommand: npm ci && npm run server:build
    startCommand: npm run server:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ORGANIZATION_NAME
        value: My Organization
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString

databases:
  - name: attendance-db
    databaseName: attendance
    user: attendance
    plan: free

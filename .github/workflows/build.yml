name: Build desktop apps

# CI runs only when a version tag is pushed from a commit on main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            target: ""
            args: ""
          - name: Linux
            platform: ubuntu-22.04
            target: ""
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          tagged_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install dependencies
        run: npm ci

      - name: Verify desktop frontend
        run: npm run desktop:build

      - name: Verify API server
        run: |
          npm run server:build
          npm run server:test

      - name: Verify backend
        run: cargo test --lib --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build app bundles
        uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[platform]-[arch]-[bundle]"
          retryAttempts: 2
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Attendance {0}', github.ref_name) || '' }}
          releaseBody: |
            Installers for macOS (Apple Silicon and Intel), Windows, and Linux.
            macOS builds are unsigned until code signing is configured; if macOS blocks them, right-click the app and choose Open.
          releaseDraft: false
          prerelease: false

      - name: Show artifact paths
        run: echo "Built ${{ steps.tauri.outputs.artifactPaths }}"
